name: iOS Build Check

on:
  push:
    branches: [main]
    paths:
      - 'ios/**'
      - '.github/workflows/ios-build.yml'
  pull_request:
    paths:
      - 'ios/**'
      - '.github/workflows/ios-build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build Art Flow Creative for iOS Simulator
        run: |
          set -o pipefail
          xcodebuild \
            -project ios/ArtFlowCreative.xcodeproj \
            -scheme ArtFlowCreative \
            -configuration Release \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Build Art Flow Creative for iOS device
        run: |
          set -o pipefail
          xcodebuild \
            -project ios/ArtFlowCreative.xcodeproj \
            -scheme ArtFlowCreative \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            build
