name: iOS Build Check

on:
  push:
    branches: [main]
    paths:
      - 'ios/**'
      - '.github/workflows/ios-build.yml'
  pull_request:
    paths:
      - 'ios/**'
      - '.github/workflows/ios-build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Validate App Store assets and metadata
        run: |
          set -euo pipefail

          ICON="ios/ArtFlowCreative/Assets.xcassets/AppIcon.appiconset/AppIcon-1024.png"
          PLIST="ios/ArtFlowCreative/Info.plist"
          PROJECT="ios/ArtFlowCreative.xcodeproj/project.pbxproj"
          PRIVACY="ios/ArtFlowCreative/PrivacyInfo.xcprivacy"
          ENTITLEMENTS="ios/ArtFlowCreative/ArtFlowCreative.entitlements"

          test -f "$ICON"
          test -f "$PLIST"
          test -f "$PRIVACY"
          test -f "$ENTITLEMENTS"
          plutil -lint "$PRIVACY"
          plutil -lint "$ENTITLEMENTS"
          grep -F "PrivacyInfo.xcprivacy in Resources" "$PROJECT"
          grep -F "CODE_SIGN_ENTITLEMENTS = ArtFlowCreative/ArtFlowCreative.entitlements;" "$PROJECT"
          /usr/libexec/PlistBuddy -c "Print :com.apple.developer.applesignin:0" "$ENTITLEMENTS" | grep -Fx "Default"

          WIDTH="$(sips -g pixelWidth "$ICON" | awk '/pixelWidth/ {print $2}')"
          HEIGHT="$(sips -g pixelHeight "$ICON" | awk '/pixelHeight/ {print $2}')"
          ALPHA="$(sips -g hasAlpha "$ICON" | awk '/hasAlpha/ {print $2}')"

          test "$WIDTH" = "1024"
          test "$HEIGHT" = "1024"
          if [ "$ALPHA" = "yes" ]; then
            echo "App Store icon must not contain transparency."
            exit 1
          fi

          /usr/libexec/PlistBuddy -c "Print :CFBundleDisplayName" "$PLIST" | grep -Fx "Art Flow Creative"
          /usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$PLIST" | grep -Fx '$(MARKETING_VERSION)'
          /usr/libexec/PlistBuddy -c "Print :CFBundleVersion" "$PLIST" | grep -Fx '$(CURRENT_PROJECT_VERSION)'
          /usr/libexec/PlistBuddy -c "Print :ITSAppUsesNonExemptEncryption" "$PLIST" | grep -Fx "false"
          /usr/libexec/PlistBuddy -c "Print :NSCameraUsageDescription" "$PLIST" | grep -F "product or inventory photo"
          /usr/libexec/PlistBuddy -c "Print :NSPhotoLibraryUsageDescription" "$PLIST" | grep -F "product or inventory images"
          /usr/libexec/PlistBuddy -c "Print :ARTFLOW_IAP_PRODUCT_IDS:0" "$PLIST" | grep -Fx "com.artflowcreative.app.monthly"
          /usr/libexec/PlistBuddy -c "Print :ARTFLOW_IAP_PRODUCT_IDS:1" "$PLIST" | grep -Fx "com.artflowcreative.app.yearly"

          grep -F "PRODUCT_BUNDLE_IDENTIFIER = com.artflowcreative.app;" "$PROJECT"
          grep -F "MARKETING_VERSION = 1.0;" "$PROJECT"
          grep -F "CURRENT_PROJECT_VERSION = 1;" "$PROJECT"

      - name: Build Art Flow Creative for iOS Simulator
        run: |
          set -o pipefail
          xcodebuild \
            -project ios/ArtFlowCreative.xcodeproj \
            -scheme ArtFlowCreative \
            -configuration Release \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Build Art Flow Creative for iOS device
        run: |
          set -o pipefail
          xcodebuild \
            -project ios/ArtFlowCreative.xcodeproj \
            -scheme ArtFlowCreative \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            build
