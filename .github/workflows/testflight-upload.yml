name: Upload Art Flow to TestFlight

on:
  workflow_dispatch:
    inputs:
      build_number:
        description: Optional App Store build number (defaults to this GitHub run number)
        required: false
        type: string
      upload:
        description: Upload the signed archive to App Store Connect
        required: true
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  testflight:
    runs-on: macos-26
    timeout-minutes: 45

    env:
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
      APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      APP_STORE_CONNECT_API_KEY_P8: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}

    steps:
      - name: Checkout release candidate
        uses: actions/checkout@v4
        with:
          ref: app-store-rc-1

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Validate Apple upload credentials
        run: |
          set -euo pipefail
          test -n "$APPLE_TEAM_ID"
          test -n "$APP_STORE_CONNECT_KEY_ID"
          test -n "$APP_STORE_CONNECT_ISSUER_ID"
          test -n "$APP_STORE_CONNECT_API_KEY_P8"

      - name: Install App Store Connect API key
        run: |
          set -euo pipefail
          KEY_DIR="$HOME/.appstoreconnect/private_keys"
          KEY_PATH="$KEY_DIR/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8"
          mkdir -p "$KEY_DIR"
          printf '%s\n' "$APP_STORE_CONNECT_API_KEY_P8" > "$KEY_PATH"
          chmod 600 "$KEY_PATH"
          echo "ASC_KEY_PATH=$KEY_PATH" >> "$GITHUB_ENV"

      - name: Resolve build number
        run: |
          set -euo pipefail
          BUILD_NUMBER="${{ inputs.build_number }}"
          if [ -z "$BUILD_NUMBER" ]; then
            BUILD_NUMBER="${GITHUB_RUN_NUMBER}"
          fi
          case "$BUILD_NUMBER" in
            *[!0-9]*|'')
              echo "Build number must contain digits only."
              exit 1
              ;;
          esac
          echo "ARTFLOW_BUILD_NUMBER=$BUILD_NUMBER" >> "$GITHUB_ENV"
          echo "Using App Store build number $BUILD_NUMBER"

      - name: App Store preflight
        run: |
          set -euo pipefail
          ICON="ios/ArtFlowCreative/Assets.xcassets/AppIcon.appiconset/AppIcon-1024.png"
          PLIST="ios/ArtFlowCreative/Info.plist"
          PROJECT="ios/ArtFlowCreative.xcodeproj/project.pbxproj"

          WIDTH="$(sips -g pixelWidth "$ICON" | awk '/pixelWidth/ {print $2}')"
          HEIGHT="$(sips -g pixelHeight "$ICON" | awk '/pixelHeight/ {print $2}')"
          ALPHA="$(sips -g hasAlpha "$ICON" | awk '/hasAlpha/ {print $2}')"

          test "$WIDTH" = "1024"
          test "$HEIGHT" = "1024"
          test "$ALPHA" != "yes"

          /usr/libexec/PlistBuddy -c "Print :ITSAppUsesNonExemptEncryption" "$PLIST" | grep -Fx "false"
          /usr/libexec/PlistBuddy -c "Print :ARTFLOW_IAP_PRODUCT_IDS:0" "$PLIST" | grep -Fx "com.artflowcreative.app.monthly"
          /usr/libexec/PlistBuddy -c "Print :ARTFLOW_IAP_PRODUCT_IDS:1" "$PLIST" | grep -Fx "com.artflowcreative.app.yearly"
          grep -F "PRODUCT_BUNDLE_IDENTIFIER = com.artflowcreative.app;" "$PROJECT"

      - name: Archive signed iOS app
        run: |
          set -euo pipefail
          rm -rf build/TestFlight
          mkdir -p build/TestFlight

          xcodebuild \
            -project ios/ArtFlowCreative.xcodeproj \
            -scheme ArtFlowCreative \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$PWD/build/TestFlight/ArtFlowCreative.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$APP_STORE_CONNECT_KEY_ID" \
            -authenticationKeyIssuerID "$APP_STORE_CONNECT_ISSUER_ID" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGN_STYLE=Automatic \
            CURRENT_PROJECT_VERSION="$ARTFLOW_BUILD_NUMBER" \
            archive

      - name: Create export options
        run: |
          cat > build/TestFlight/ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>destination</key>
            <string>${{ inputs.upload && 'upload' || 'export' }}</string>
            <key>signingStyle</key>
            <string>automatic</string>
            <key>teamID</key>
            <string>${APPLE_TEAM_ID}</string>
            <key>manageAppVersionAndBuildNumber</key>
            <false/>
            <key>uploadSymbols</key>
            <true/>
          </dict>
          </plist>
          EOF

      - name: Export and optionally upload to App Store Connect
        run: |
          set -euo pipefail
          xcodebuild \
            -exportArchive \
            -archivePath "$PWD/build/TestFlight/ArtFlowCreative.xcarchive" \
            -exportPath "$PWD/build/TestFlight/export" \
            -exportOptionsPlist "$PWD/build/TestFlight/ExportOptions.plist" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$APP_STORE_CONNECT_KEY_ID" \
            -authenticationKeyIssuerID "$APP_STORE_CONNECT_ISSUER_ID"

      - name: Save upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: artflow-testflight-logs-${{ github.run_number }}
          path: |
            build/TestFlight/*.xcdistributionlogs
            build/TestFlight/export
          if-no-files-found: ignore
          retention-days: 14
